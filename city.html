  <script src="static/js/common.js?v=20260814"></script>
  <script>
    /* ============================================================
       城市高校页 - 客户端筛选与渲染
       ============================================================ */

    (function initCityPage() {
      var tierNames = window.AppUtils.tierNames;
      var tierNamesEn = window.AppUtils.tierNamesEn;
      var tierOrder = ["C9", "985", "211", "双一流", "普通", "学院"];

      var titleZh = document.getElementById('titleZh');
      var titleEn = document.getElementById('titleEn');
      var subZh = document.getElementById('subZh');
      var subEn = document.getElementById('subEn');
      var cityStats = document.getElementById('cityStats');
      var uniGrid = document.getElementById('uniGrid');

      var provinceParam = null;
      var provinceUniversities = [];
      var provinceEn = '';

      function getProvinceFromURL() {
        var params = new URLSearchParams(window.location.search);
        var raw = params.get('province');
        return raw ? decodeURIComponent(raw) : null;
      }

      function groupByTier(unis) {
        var groups = {};
        unis.forEach(function(u) {
          var tier = u.tier || '普通';
          if (!groups[tier]) groups[tier] = [];
          groups[tier].push(u);
        });
        return groups;
      }

      function renderStats(unis) {
        var groups = groupByTier(unis);
        var lang = window.getLang ? window.getLang() : (localStorage.getItem('lang') || 'zh');
        var isEn = lang === 'en';

        var html = '';
        tierOrder.forEach(function(tier) {
          var list = groups[tier];
          if (!list || list.length === 0) return;
          var tierZh = tierNames[tier] || tier;
          var tierEn = tierNamesEn[tier] || tier;
          html += '<div class="city-stat-item">' +
            '<span class="tier-badge tier-' + tier + '">' +
              '<span class="lang-zh">' + tierZh + '</span>' +
              '<span class="lang-en" style="display:none;">' + tierEn + '</span>' +
            '</span>' +
            '<span class="city-stat-count">' + list.length + '</span>' +
          '</div>';
        });
        cityStats.innerHTML = html;
      }

      function renderCards(unis) {
        if (!unis.length) {
          uniGrid.innerHTML = '';
          return;
        }

        uniGrid.innerHTML = unis.map(function(u) {
          var nameZh = u.name;
          var nameEn = u.name_en || '';
          var motto = u.motto || '';
          var mottoEn = u.motto_en || '';
          var tier = u.tier || '普通';
          var tierZh = tierNames[tier] || tier;
          var tierEn = tierNamesEn[tier] || tier;
          var ranking = u.ranking || '';
          var badge = u.badge || '';
          var campus = u.campus || '';

          return '<a href="university.html?id=' + u.id + '" class="uni-card">' +
            '<div class="uni-card-img">' +
              '<div class="uni-card-rank">' + ranking + '</div>' +
              '<img src="' + campus + '" alt="' + nameZh + ' ' + nameEn + ' Campus" data-alt-en="' + nameEn + ' Campus">' +
            '</div>' +
            '<div class="uni-card-body">' +
              '<div class="uni-card-row">' +
                '<div class="uni-card-seal"><img src="' + badge + '" alt="' + nameZh + ' ' + nameEn + ' Emblem" data-alt-en="' + nameEn + ' Emblem"></div>' +
                '<div>' +
                  '<div class="uni-card-name">' +
                    '<span class="lang-zh">' + nameZh + '</span>' +
                    '<span class="lang-en" style="display:none;">' + nameEn + '</span>' +
                  '</div>' +
                  '<div class="uni-card-name-en">' + nameEn + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="uni-card-motto">' +
                '<span class="lang-zh">「' + motto + '」</span>' +
                '<span class="lang-en" style="display:none;">"' + (mottoEn || motto) + '"</span>' +
              '</div>' +
              '<div class="uni-card-tags">' +
                '<span class="tier-badge tier-' + tier + '"><span class="lang-zh">' + tierZh + '</span><span class="lang-en" style="display:none;">' + tierEn + '</span></span>' +
                '<span class="uni-card-city"><span class="lang-zh">排名 ' + ranking + '</span><span class="lang-en" style="display:none;">Rank ' + ranking + '</span></span>' +
              '</div>' +
            '</div>' +
          '</a>';
        }).join('');
      }

      function renderNotFound() {
        titleZh.textContent = '省份未找到';
        titleEn.textContent = 'Province Not Found';
        subZh.textContent = '未找到该省份的高校信息';
        subEn.textContent = 'No universities found for this province';
        cityStats.innerHTML = '';
        uniGrid.innerHTML = '';
      }

      function renderAll() {
        if (!provinceUniversities.length) {
          renderNotFound();
          return;
        }

        provinceEn = provinceUniversities[0].province_en || provinceParam;

        titleZh.textContent = provinceParam + ' 的大学';
        titleEn.textContent = 'Universities in ' + provinceEn;
        // 更新页面标题和 meta
        document.title = provinceParam + ' 高校 · 捷报神州';
        var metaZh = document.querySelector('meta[name="title-zh"]');
        var metaEn = document.querySelector('meta[name="title-en"]');
        if (metaZh) metaZh.setAttribute('content', provinceParam + ' 高校 · 捷报神州');
        if (metaEn) metaEn.setAttribute('content', 'Universities in ' + provinceEn + ' · Victell');
        subZh.textContent = provinceUniversities.length + ' 所高校汇聚于此';
        subEn.textContent = provinceUniversities.length + ' universities in this province';

        renderStats(provinceUniversities);
        renderCards(provinceUniversities);

        reapplyLang();
      }

      function reapplyLang() {
        var lang = window.getLang ? window.getLang() : (localStorage.getItem('lang') || 'zh');
        var isEn = lang === 'en';

        document.querySelectorAll('.lang-zh').forEach(function(el) {
          el.style.display = isEn ? 'none' : '';
          var tag = el.tagName.toLowerCase();
          if (!isEn && (tag === 'span' || tag === 'a' || tag === 'button' || tag === 'label')) {
            el.style.display = 'inline';
          } else if (!isEn && (tag === 'p' || tag === 'div' || tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4' || tag === 'li')) {
            el.style.display = 'block';
          }
        });
        document.querySelectorAll('.lang-en').forEach(function(el) {
          el.style.display = isEn ? '' : 'none';
          var tag = el.tagName.toLowerCase();
          if (isEn && (tag === 'span' || tag === 'a' || tag === 'button' || tag === 'label')) {
            el.style.display = 'inline';
          } else if (isEn && (tag === 'p' || tag === 'div' || tag === 'h1' || tag === 'h2' || tag === 'h3' || tag === 'h4' || tag === 'li')) {
            el.style.display = 'block';
          }
        });

        document.querySelectorAll('img[data-alt-en]').forEach(function(el) {
          if (!el.hasAttribute('data-alt-zh')) el.setAttribute('data-alt-zh', el.getAttribute('alt') || '');
          el.setAttribute('alt', isEn ? el.getAttribute('data-alt-en') : el.getAttribute('data-alt-zh'));
        });
      }

      function init() {
        provinceParam = getProvinceFromURL();

        if (!provinceParam) {
          renderNotFound();
          return;
        }

        if (!window.APP_DATA || !window.APP_DATA.loadPromise) {
          setTimeout(init, 100);
          return;
        }

        window.APP_DATA.loadPromise.then(function(data) {
          provinceUniversities = (data || []).filter(function(u) {
            return u.province === provinceParam;
          });
          renderAll();
        });
      }

      // 监听语言切换，重新渲染
      document.addEventListener('langchange', function() {
        renderAll();
      });

      init();
    })();
  </script>
